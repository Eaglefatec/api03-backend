name: Backend tests

on:
  pull_request:
    branches: [sprint-1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fusex_db
          MYSQL_USER: spring
          MYSQL_PASSWORD: spring
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -u spring -pspring -D fusex_db -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fusex/pom.xml
      - name: Test application with MySQL
        working-directory: fusex
        env:
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test
