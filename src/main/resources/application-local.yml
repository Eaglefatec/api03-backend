spring:
  application:
    name: fusex

  datasource:
    url: jdbc:mysql://localhost:3306/fusex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: spring
    password: spring
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    "[com.eagle.fusex]": DEBUG
    "[org.hibernate.SQL]": DEBUG
